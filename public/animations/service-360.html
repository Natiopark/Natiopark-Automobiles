<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Natiopark Automobiles, un service 360°</title>
<style>
  /* Jetons repris de la charte du site natiopark-automobiles.fr */
  /* Couleurs relevées dans le logo Natiopark Automobiles */
  :root {
    --fond: #0d0d0d;
    --or: #c9b47f;
    --texte: #f4f1ea;
    --doux: #9a968c;
    --pastille: rgba(13, 13, 13, 0.55);
    --font-ui: Verdana, Geneva, sans-serif;
  }
  body.clair {
    --fond: #f4f1ea;
    --or: #8a7443;
    --texte: #141414;
    --doux: #5f5b52;
    --pastille: rgba(244, 241, 234, 0.75);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background:
      radial-gradient(ellipse 55% 50% at 50% 42%, color-mix(in srgb, var(--or) 7%, var(--fond)), var(--fond) 70%);
    color: var(--texte);
    font-family: var(--font-ui);
    overflow: hidden;
  }
  body.transparent { background: transparent; }

  .scene { position: relative; width: 100%; height: 100%; min-height: 460px; }
  .scene canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }

  .legende-bloc {
    position: absolute; left: 50%; bottom: max(4%, 18px);
    transform: translateX(-50%);
    width: min(88%, 460px);
    text-align: center; pointer-events: none;
    opacity: 0; transition: opacity 1s ease;
  }
  .pret .legende-bloc { opacity: 1; }
  .titre {
    margin: 0;
    font: 400 clamp(1.05rem, 2.4vw, 1.4rem)/1.2 var(--font-ui);
    letter-spacing: 0.04em;
    color: var(--or);
  }
  .legende {
    margin: 0.5rem 0 0;
    font-size: clamp(0.74rem, 1.5vw, 0.86rem);
    line-height: 1.6; color: var(--doux);
    min-height: 3.2em;
  }
  .legende strong { display: block; color: var(--texte); font-weight: 400; }

  .pole {
    position: absolute; left: 0; top: 0;
    font: 400 clamp(0.7rem, 1.35vw, 0.84rem)/1 var(--font-ui);
    letter-spacing: 0.02em;
    color: var(--texte);
    background: var(--pastille); border: 1px solid color-mix(in srgb, var(--or) 25%, transparent);
    padding: 0.5em 0.8em; border-radius: 999px;
    cursor: pointer; white-space: nowrap;
    opacity: 0; will-change: transform, opacity;
    transition: color .3s ease, border-color .3s ease, background-color .3s ease;
  }
  .pole:hover, .pole:focus-visible, .pole.actif {
    color: var(--fond); background: var(--or); border-color: var(--or);
  }
  .pole:focus-visible { outline: 1px solid var(--or); outline-offset: 3px; }
</style>
</head>
<body>
<div class="scene" id="scene">
  <div class="legende-bloc">
    <p class="titre" id="titre"></p>
    <p class="legende" id="legende" aria-live="polite"></p>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
/* ============================================================
   CONFIGURATION — textes, couleurs, comportement
   ============================================================ */
const CONFIG = {
  titre: "Un service 360°",
  sousTitre: "Un interlocuteur unique pour tous vos sujets automobiles. Survolez un service pour voir comment il s'articule avec les autres.",
  poles: [
    { nom: "Cosmétique",            detail: "Carrosserie et jantes remises en valeur : retouches, lustrage, protection." },
    { nom: "Entretien",             detail: "Révisions et suivi mécanique pour un véhicule toujours prêt." },
    { nom: "Detailing",             detail: "Nettoyage en profondeur, intérieur comme extérieur." },
    { nom: "Transport",             detail: "Votre véhicule acheminé en toute sécurité, là où vous le souhaitez." },
    { nom: "Achat & vente",         detail: "Trouver la perle rare, ou vendre votre véhicule en toute sérénité." },
    { nom: "SIV & immatriculation", detail: "Démarches administratives prises en charge par un professionnel habilité SIV." },
    { nom: "Restauration",          detail: "Redonner vie aux véhicules anciens et de collection." }
  ],

  theme: "sombre",       // "sombre" (or sur noir) ou "clair" (noir sur crème), comme les deux versions du logo
  fondTransparent: true,
  vitesseRotation: 1     // 0 = immobile, 1 = normal, 2 = deux fois plus vite
};

/* ============================================================ */
(function () {
  const conteneur = document.getElementById("scene");
  const legende = document.getElementById("legende");
  document.getElementById("titre").textContent = CONFIG.titre;
  legende.textContent = CONFIG.sousTitre;
  if (CONFIG.fondTransparent) document.body.classList.add("transparent");
  const clair = CONFIG.theme === "clair";
  if (clair) document.body.classList.add("clair");
  const COUL = clair
    ? { embleme: 0x141414, lien: 0x8a7443, impulsion: 0xa88f55, anneau: 0x141414, graduation: 0x5f5b52, bille: 0x141414 }
    : { embleme: 0xc9b47f, lien: 0xc9b47f, impulsion: 0xf4f1ea, anneau: 0xc9b47f, graduation: 0x9a968c, bille: 0xf4f1ea };
  CONFIG.couleurs = COUL;

  const reduit = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  renderer.setClearColor(0x000000, 0);
  renderer.outputEncoding = THREE.sRGBEncoding;
  conteneur.prepend(renderer.domElement);

  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(36, 1, 0.1, 100);
  camera.position.set(0, 0, 13);

  const racine = new THREE.Group();
  racine.position.y = 0.55;
  scene.add(racine);

  /* ---------- Environnement studio pour le rendu métal ---------- */
  (function environnement() {
    const env = new THREE.Scene();
    const boite = new THREE.Mesh(new THREE.BoxGeometry(20, 20, 20),
      new THREE.MeshBasicMaterial({ color: 0x0c0d10, side: THREE.BackSide }));
    env.add(boite);
    const softbox = (w, h, c, x, y, z, ry, rx) => {
      const m = new THREE.Mesh(new THREE.PlaneGeometry(w, h), new THREE.MeshBasicMaterial({ color: c, side: THREE.DoubleSide }));
      m.position.set(x, y, z); m.rotation.set(rx || 0, ry || 0, 0); env.add(m);
    };
    softbox(12, 2.2, 0xffffff, 0, 8, 0, 0, Math.PI / 2);          // bandeau haut
    softbox(4, 10, 0xd8d6d0, -9.5, 0, 0, Math.PI / 2);            // latéral gauche
    softbox(3, 8, 0xfff1d6, 9.5, -1, 2, -Math.PI / 2);            // reflet chaud
    softbox(8, 3, 0x6a6860, 0, -2, -9.5, 0);                      // arrière
    const pmrem = new THREE.PMREMGenerator(renderer);
    scene.environment = pmrem.fromScene(env, 0.04).texture;
  })();

  /* ---------- Emblème 3D : le logo Natiopark Automobiles ---------- */
  // N vectorisé d'après Natiopark_Automobiles_Logo.pdf (coordonnées normalisées : rayon du grand cercle = 1)
  const TRACE_N = [[-0.3817, 0.4353], [-0.3965, 0.4187], [-0.4002, 0.4039], [-0.4002, -0.4242], [-0.3965, -0.4353], [-0.3854, -0.4445], [-0.3706, -0.4464], [-0.3614, -0.4427], [-0.3521, -0.4335], [-0.3503, -0.4279], [-0.3503, 0.2967], [-0.3466, 0.3041], [-0.341, 0.3078], [-0.3189, 0.2874], [-0.2283, 0.1802], [-0.1543, 0.086], [-0.086, -0.0065], [-0.0083, -0.1174], [0.0675, -0.232], [0.1414, -0.3503], [0.1858, -0.4261], [0.2006, -0.439], [0.2227, -0.4464], [0.3799, -0.4464], [0.3891, -0.4427], [0.3965, -0.4353], [0.4002, -0.4261], [0.4002, 0.4205], [0.3946, 0.4335], [0.3854, 0.4409], [0.3762, 0.4427], [0.3669, 0.4409], [0.354, 0.4316], [0.3503, 0.4224], [0.3503, -0.2948], [0.3484, -0.3004], [0.341, -0.3059], [0.3262, -0.293], [0.2652, -0.1932], [0.1728, -0.0545], [0.0508, 0.1118], [-0.0638, 0.2523], [-0.1414, 0.3392], [-0.2209, 0.4224], [-0.232, 0.4316], [-0.2431, 0.4372], [-0.2726, 0.4427], [-0.3577, 0.4427], [-0.3595, 0.4409], [-0.3688, 0.4409]];
  const emblème = new THREE.Group();
  racine.add(emblème);
  const rE = 1.55;
  const formeN = new THREE.Shape(TRACE_N.map(p => new THREE.Vector2(p[0] * rE, p[1] * rE)));
  const matEmbleme = clair
    ? new THREE.MeshStandardMaterial({ color: COUL.embleme, metalness: 0.2, roughness: 0.45, envMapIntensity: 0.4 })
    : new THREE.MeshStandardMaterial({ color: COUL.embleme, metalness: 0.65, roughness: 0.3, envMapIntensity: 1.3, emissive: 0x2a2110 });
  const geoN = new THREE.ExtrudeGeometry(formeN, { depth: 0.16, bevelEnabled: true, bevelThickness: 0.025, bevelSize: 0.012, bevelSegments: 3 });
  geoN.translate(0, 0, -0.08);
  emblème.add(new THREE.Mesh(geoN, matEmbleme));
  // Double cercle : grand cercle épais, petit cercle fin (proportions du logo)
  function anneauPlat(r0, r1, profondeur) {
    const f = new THREE.Shape(); f.absarc(0, 0, r1 * rE, 0, Math.PI * 2, false);
    const t = new THREE.Path(); t.absarc(0, 0, r0 * rE, 0, Math.PI * 2, true); f.holes.push(t);
    const g = new THREE.ExtrudeGeometry(f, { depth: profondeur, bevelEnabled: false, curveSegments: 160 });
    g.translate(0, 0, -profondeur / 2);
    return new THREE.Mesh(g, matEmbleme);
  }
  emblème.add(anneauPlat(0.9806, 1.0, 0.1), anneauPlat(0.9126, 0.9207, 0.06));
  emblème.scale.setScalar(0.0001);

  /* ---------- Texture de halo ---------- */
  const halo = (function () {
    const c = document.createElement("canvas"); c.width = c.height = 64;
    const g = c.getContext("2d");
    const gr = g.createRadialGradient(32, 32, 0, 32, 32, 32);
    gr.addColorStop(0, "rgba(255,255,255,1)");
    gr.addColorStop(0.25, "rgba(255,255,255,0.4)");
    gr.addColorStop(1, "rgba(255,255,255,0)");
    g.fillStyle = gr; g.fillRect(0, 0, 64, 64);
    return new THREE.CanvasTexture(c);
  })();

  function cercle(r, n) {
    const pts = [];
    for (let i = 0; i <= n; i++) {
      const a = (i / n) * Math.PI * 2;
      pts.push(new THREE.Vector3(Math.cos(a) * r, 0, Math.sin(a) * r));
    }
    return pts;
  }

  /* ---------- Cadran 360° ---------- */
  const orbite = new THREE.Group();
  orbite.rotation.x = 0.4;
  racine.add(orbite);
  const R = 3.7;

  const geoAnneau = new THREE.BufferGeometry().setFromPoints(cercle(R, 360));
  const nbAnneau = geoAnneau.attributes.position.count;
  orbite.add(new THREE.Line(geoAnneau, new THREE.LineBasicMaterial({ color: CONFIG.couleurs.anneau, transparent: true, opacity: 0.5 })));
  geoAnneau.setDrawRange(0, 0);

  const ptsGrad = [];
  for (let d = 0; d < 360; d += 5) {
    const a = (d / 360) * Math.PI * 2;
    const long = d % 30 === 0 ? 0.24 : d % 10 === 0 ? 0.12 : 0.06;
    const r0 = R + 0.1, r1 = r0 + long;
    ptsGrad.push(new THREE.Vector3(Math.cos(a) * r0, 0, Math.sin(a) * r0), new THREE.Vector3(Math.cos(a) * r1, 0, Math.sin(a) * r1));
  }
  const matGrad = new THREE.LineBasicMaterial({ color: CONFIG.couleurs.graduation, transparent: true, opacity: 0 });
  orbite.add(new THREE.LineSegments(new THREE.BufferGeometry().setFromPoints(ptsGrad), matGrad));

  /* ---------- Services ---------- */
  const n = CONFIG.poles.length;
  const poles = CONFIG.poles.map((p, i) => {
    const a = (i / n) * Math.PI * 2 - Math.PI / 2;
    const pos = new THREE.Vector3(Math.cos(a) * R, 0, Math.sin(a) * R);
    const bille = new THREE.Mesh(new THREE.SphereGeometry(0.075, 20, 20), new THREE.MeshBasicMaterial({ color: CONFIG.couleurs.bille }));
    bille.position.copy(pos);
    const sprite = new THREE.Sprite(new THREE.SpriteMaterial({ map: halo, color: CONFIG.couleurs.impulsion, transparent: true, blending: clair ? THREE.NormalBlending : THREE.AdditiveBlending, depthWrite: false }));
    sprite.scale.set(0.5, 0.5, 1);
    bille.add(sprite);
    bille.scale.setScalar(0.0001);
    orbite.add(bille);

    const btn = document.createElement("button");
    btn.className = "pole"; btn.type = "button";
    btn.textContent = p.nom;
    btn.setAttribute("aria-label", p.nom + " : " + p.detail);
    conteneur.appendChild(btn);
    return { ...p, pos, bille, sprite, btn };
  });

  /* ---------- Liens transversaux : chaque service relié à tous les autres ---------- */
  const liens = [];
  for (let i = 0; i < n; i++) {
    for (let j = i + 1; j < n; j++) {
      const a = poles[i].pos, b = poles[j].pos;
      const ctrl = a.clone().add(b).multiplyScalar(0.15);
      ctrl.y = ((i + j) % 2 ? 1 : -1) * (0.7 + 0.25 * ((j - i) % 3));
      const courbe = new THREE.QuadraticBezierCurve3(a, ctrl, b);
      const mat = new THREE.LineBasicMaterial({ color: CONFIG.couleurs.lien, transparent: true, opacity: 0 });
      orbite.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(courbe.getPoints(60)), mat));
      const impulsion = new THREE.Sprite(new THREE.SpriteMaterial({ map: halo, color: CONFIG.couleurs.impulsion, transparent: true, opacity: 0, blending: clair ? THREE.NormalBlending : THREE.AdditiveBlending, depthWrite: false }));
      impulsion.scale.set(0.2, 0.2, 1);
      orbite.add(impulsion);
      liens.push({ i, j, courbe, mat, impulsion, decalage: Math.random(), vitesse: 0.11 + Math.random() * 0.09, sens: Math.random() < 0.5 ? 1 : -1 });
    }
  }

  /* ---------- Lumière d'appoint ---------- */
  const lumiere = new THREE.DirectionalLight(0xffffff, 0.6);
  lumiere.position.set(3, 5, 6);
  scene.add(lumiere, new THREE.AmbientLight(0xffffff, 0.15));

  /* ---------- Interaction ---------- */
  let actif = -1;
  function activer(i) {
    actif = i;
    poles.forEach((p, idx) => p.btn.classList.toggle("actif", idx === i));
    if (i < 0) { legende.textContent = CONFIG.sousTitre; return; }
    legende.innerHTML = "";
    const s = document.createElement("strong"); s.textContent = poles[i].nom;
    legende.append(s, document.createTextNode(poles[i].detail));
  }
  poles.forEach((p, i) => {
    p.btn.addEventListener("mouseenter", () => activer(i));
    p.btn.addEventListener("focus", () => activer(i));
    p.btn.addEventListener("click", () => activer(actif === i ? -1 : i));
    p.btn.addEventListener("mouseleave", () => activer(-1));
    p.btn.addEventListener("blur", () => activer(-1));
  });

  const pointeur = { x: 0, y: 0 };
  conteneur.addEventListener("pointermove", e => {
    const r = conteneur.getBoundingClientRect();
    pointeur.x = ((e.clientX - r.left) / r.width) * 2 - 1;
    pointeur.y = ((e.clientY - r.top) / r.height) * 2 - 1;
  });
  conteneur.addEventListener("pointerleave", () => { pointeur.x = 0; pointeur.y = 0; });

  /* ---------- Taille ---------- */
  let L = 1, H = 1;
  function redimensionner() {
    const r = conteneur.getBoundingClientRect();
    L = Math.max(1, r.width); H = Math.max(1, r.height);
    renderer.setSize(L, H, false);
    camera.aspect = L / H;
    camera.position.z = camera.aspect < 1.1 ? 13 * (1.1 / Math.max(camera.aspect, 0.45)) * 0.8 : 13;
    camera.updateProjectionMatrix();
  }
  new ResizeObserver(redimensionner).observe(conteneur);
  redimensionner();

  /* ---------- Boucle ---------- */
  let visible = true;
  new IntersectionObserver(e => { visible = e[0].isIntersecting; }).observe(conteneur);

  const horloge = new THREE.Clock();
  let t = reduit ? 10 : 0;
  let angle = 0, facteur = 1;
  const v = new THREE.Vector3(), w = new THREE.Vector3(), c0 = new THREE.Vector3();
  const clamp = x => Math.min(1, Math.max(0, x));
  const ease = x => 1 - Math.pow(1 - x, 3);
  let pret = false;

  function boucle() {
    requestAnimationFrame(boucle);
    const dt = Math.min(horloge.getDelta(), 0.05);
    if (!visible || document.hidden) return;
    t += dt;

    // Intro : l'emblème fait un tour complet (360°), le cadran se trace, puis les services et les liens
    const pE = ease(clamp(t / 2.2));
    emblème.scale.setScalar(Math.max(0.0001, 0.6 + 0.4 * pE) * (t > 0.05 ? 1 : 0.0001));
    const oscillation = reduit ? 0 : Math.sin(t * 0.45) * 0.35;
    emblème.rotation.y = (1 - pE) * -Math.PI * 2 + oscillation;
    emblème.rotation.x = reduit ? 0 : Math.sin(t * 0.3) * 0.06;

    geoAnneau.setDrawRange(0, Math.floor(nbAnneau * ease(clamp((t - 0.4) / 1.6))));
    matGrad.opacity = 0.55 * clamp((t - 1.4) / 0.8);
    if (!pret && t > 1.6) { conteneur.classList.add("pret"); pret = true; }
    const introLiens = clamp((t - 2.8) / 1.0);

    facteur += ((actif >= 0 ? 0 : 1) - facteur) * 0.05;
    if (!reduit) angle += dt * 0.09 * CONFIG.vitesseRotation * facteur;
    orbite.rotation.y = angle;

    if (!reduit) {
      racine.rotation.x += (pointeur.y * 0.1 - racine.rotation.x) * 0.04;
      racine.rotation.y += (pointeur.x * 0.16 - racine.rotation.y) * 0.04;
    }

    liens.forEach(l => {
      const concerne = actif >= 0 && (l.i === actif || l.j === actif);
      const cible = introLiens * (actif < 0 ? 0.2 : concerne ? 0.95 : 0.05);
      l.mat.opacity += (cible - l.mat.opacity) * 0.08;
      if (reduit) { l.impulsion.material.opacity = 0; return; }
      let u = (t * l.vitesse * (concerne ? 2 : 1) + l.decalage) % 1;
      if (l.sens < 0) u = 1 - u;
      l.courbe.getPoint(u, l.impulsion.position);
      l.impulsion.material.opacity = introLiens * Math.sin(u * Math.PI) * (actif < 0 ? 0.75 : concerne ? 1 : 0.04);
      const s = concerne ? 0.3 : 0.2;
      l.impulsion.scale.set(s, s, 1);
    });

    c0.set(0, 0, 0); racine.localToWorld(c0); c0.project(camera);
    const cx = (c0.x * 0.5 + 0.5) * L, cy = (-c0.y * 0.5 + 0.5) * H;
    poles.forEach((p, i) => {
      const apparition = ease(clamp((t - 1.8 - i * 0.12) / 0.6));
      p.bille.scale.setScalar(Math.max(0.0001, apparition * (i === actif ? 1.6 : 1)));
      p.bille.getWorldPosition(w);
      const profondeur = clamp((w.z + R) / (2 * R));
      p.sprite.material.opacity = 0.45 + 0.55 * profondeur;

      v.copy(w).project(camera);
      let x = (v.x * 0.5 + 0.5) * L, y = (-v.y * 0.5 + 0.5) * H;
      const dx = x - cx, dy = y - cy, d = Math.hypot(dx, dy) || 1;
      x += (dx / d) * 30 + Math.sign(dx) * p.btn.offsetWidth * 0.5 * Math.min(1, Math.abs(dx / d) * 1.4); y += (dy / d) * 24;
      p.btn.style.transform = "translate(" + x.toFixed(1) + "px," + y.toFixed(1) + "px) translate(-50%,-50%)";
      p.btn.style.opacity = (apparition * (0.5 + 0.5 * profondeur)).toFixed(3);
      p.btn.style.zIndex = profondeur > 0.5 ? 3 : 1;
    });

    renderer.render(scene, camera);
  }
  boucle();
})();
</script>
</body>
</html>
